name: Keep Bot Alive

on:
  # schedule:
  #   # Run every 10 minutes to keep Render free tier awake
  #   # DISABLED: Not needed on Railway paid plan (bot doesn't sleep)
  #   - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot health endpoint
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          # Get Render service URL from GitHub secret or use default
          RENDER_URL="${RENDER_SERVICE_URL:-https://losbankos-bot.onrender.com}"
          
          echo "🔄 Pinging bot at $RENDER_URL/health..."
          
          # Try to ping the health endpoint
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$RENDER_URL/health" || echo "000")
          
          if [ "$response" = "200" ]; then
            echo "✅ Bot is alive! (HTTP $response)"
          elif [ "$response" = "000" ]; then
            echo "⚠️  Bot is waking up... (timeout or connection error)"
            echo "⚠️  This is normal if bot was sleeping. It will wake up in ~50 seconds."
          else
            echo "❌ Bot health check failed (HTTP $response)"
            echo "ℹ️  Check that RENDER_SERVICE_URL secret is set correctly"
            exit 1
          fi

