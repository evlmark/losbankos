name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase_migrations.yml'
  workflow_dispatch:  # Позволяет запускать вручную из GitHub UI

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest
    
    - name: Login to Supabase
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      run: |
        echo "Logging in to Supabase..."
        supabase login --token $SUPABASE_ACCESS_TOKEN
    
    - name: Link to Supabase project
      env:
        SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      run: |
        echo "Linking to Supabase project..."
        echo "$SUPABASE_DB_PASSWORD" | supabase link --project-ref vqqdmdffssmobsofbnqf
    
    - name: Run migrations
      run: |
        echo "Applying migrations..."
        supabase db push
    
    - name: Verify migrations
      continue-on-error: true
      run: |
        echo "✅ Migrations applied successfully"
        echo "Checking migration status..."
        supabase migration list || echo "⚠️  Migration list check failed (this is OK if tables already exist)"

