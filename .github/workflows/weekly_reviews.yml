name: Weekly Reviews Analysis

on:
  schedule:
    # Запуск каждый понедельник в 09:00 UTC (можно настроить под свой часовой пояс)
    # Формат: минута час день месяц день_недели
    # 0 = воскресенье, 1 = понедельник, и т.д.
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Позволяет запускать вручную из GitHub UI

jobs:
  analyze-reviews:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run reviews analysis
      env:
        # LLM Configuration (опционально)
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'openai' }}
        LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
        
        # Telegram Configuration
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        
        # Supabase Configuration
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        
        # Slack Configuration (опционально)
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        
        # Notification Method
        NOTIFICATION_METHOD: ${{ secrets.NOTIFICATION_METHOD || 'telegram' }}
        
        # Reviews Configuration (50 for baseline report)
        REVIEWS_PER_APP: ${{ secrets.REVIEWS_PER_APP || '50' }}
      run: |
        python main.py
    
    - name: Upload reports as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: reports-${{ github.run_number }}
        path: data/outputs/*.md
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Commit and push reports to repository
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add reports/*.md
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto: Add latest reports [skip ci]"
          # Use GIT_TOKEN if available, otherwise try GITHUB_TOKEN
          if [ -n "$GIT_TOKEN" ]; then
            git remote set-url origin https://$GIT_TOKEN@github.com/${{ github.repository }}.git
            git push origin main
          else
            # Try with GITHUB_TOKEN (requires write permissions in repo settings)
            git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
          fi
        fi
      env:
        GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
